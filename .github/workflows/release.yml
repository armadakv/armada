name: Release

on:
  push:
    tags:
    - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

permissions: {}

jobs:
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLIFF_VERSION: 2.14.2
      CLIFF_SHA512: 26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a
    steps:
    - name: Checkout the tagged code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install git-cliff
      run: |
        archive=git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz
        curl -fsSL -o "${RUNNER_TEMP}/${archive}" "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/${archive}"
        echo "${CLIFF_SHA512}  ${RUNNER_TEMP}/${archive}" | sha512sum -c -
        tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" --strip-components=1 "git-cliff-${CLIFF_VERSION}/git-cliff"
    - name: Generate release notes
      run: |
        # An explicit range, because --latest and --unreleased misbehave when HEAD is itself the latest tag.
        previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "${TAG}^")
        "${RUNNER_TEMP}/git-cliff" --config cliff.toml --tag "${TAG}" --output RELEASE_NOTES.md "${previous}..${TAG}"
        # An empty result means the PR-title parsing no longer matches the merge style.
        grep -q '^- ' RELEASE_NOTES.md || { echo "::error::No changelog entries found in ${previous}..${TAG}"; exit 1; }
    - name: Upload release notes
      uses: actions/upload-artifact@v7
      with:
        name: release-notes
        path: RELEASE_NOTES.md
        if-no-files-found: error
        retention-days: 7

  release-binary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [arm64, amd64]
        include:
        - cgo: 0
        - goos: linux
          goarch: amd64
          cgo: 1
    steps:
    - name: Checkout the latest code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: ${{ matrix.cgo }}
      shell: bash
      run: |
        make armada arctl arq            \
          && mkdir dist               \
          && mv armada dist/armada  \
          && mv arctl dist/arctl  \
          && mv arq dist/arq  \
          && tar -czvf armada-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C dist/ .
    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
        path: armada-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
        if-no-files-found: error
        retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs:
    - notes
    - release-binary
    permissions:
      contents: write
    steps:
    - name: Download release notes
      uses: actions/download-artifact@v8
      with:
        name: release-notes
    - name: Download binaries
      uses: actions/download-artifact@v8
      with:
        path: binaries
        pattern: binary-*
        merge-multiple: true
    # A draft, so that the highlights and upgrade notes can be added before publishing. Publishing triggers the docs rebuild.
    - name: Create draft release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        draft: true
        prerelease: ${{ contains(github.ref_name, '-') }}
        body_path: RELEASE_NOTES.md
        files: binaries/*.tar.gz
        fail_on_unmatched_files: true

  changelog-pr:
    runs-on: ubuntu-latest
    needs: notes
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    steps:
    - name: Checkout the default branch
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - name: Download release notes
      uses: actions/download-artifact@v8
      with:
        name: release-notes
    - name: Insert the section into docs/changelog.md
      run: hack/changelog-insert.sh RELEASE_NOTES.md docs/changelog.md
    - name: Check the bot token
      env:
        RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
      run: test -n "${RELEASE_BOT_TOKEN}" || { echo "::error::RELEASE_BOT_TOKEN is not set, see docs/contributing.md#release-notes"; exit 1; }
    # A PAT or App token is needed because PRs opened with GITHUB_TOKEN do not trigger the required checks.
    - name: Open the changelog PR
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        token: ${{ secrets.RELEASE_BOT_TOKEN }}
        branch: changelog/${{ github.ref_name }}
        title: "docs: changelog for ${{ github.ref_name }}"
        commit-message: "docs: changelog for ${{ github.ref_name }}"
        body: Generated from the release notes of this tag. Add the highlights and upgrade notes before merging.
        add-paths: docs/changelog.md
        delete-branch: true

  build-docker-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            pair: linux-arm64
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Prepare
      run: |
        platform=${{ matrix.platform }}
        echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
    - name: Checkout
      uses: actions/checkout@v7
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Docker build & push
      id: build
      uses: docker/build-push-action@v7
      with:
        platforms: ${{ matrix.platform }}
        build-args: |
          VERSION=${{ github.ref_name }}
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=image,push-by-digest=true,name-canonical=true,push=true
    - name: Export digest
      run: |
        mkdir -p ${{ runner.temp }}/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"
    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
  push-docker-image:
    runs-on: ubuntu-latest
    needs:
    - build-docker-image
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}},enable=${{!startsWith(github.ref, 'refs/tags/v0.')}}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
