name: PR title

# The PR title becomes the changelog entry, see docs/contributing.md#release-notes.
# Deliberately pull_request and not pull_request_target: nothing here needs more than a read-only token.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
    - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          perf
          refactor
          docs
          test
          build
          ci
          chore
          style
          revert
